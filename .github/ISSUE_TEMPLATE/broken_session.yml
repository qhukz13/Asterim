name: A session did not work
description: The agent would not start, stopped answering, or an approval did not do what you expected.
title: "[Session]: "
labels:
  - session

body:
  - type: markdown
    attributes:
      value: |
        Two things make this fast to answer, and neither sends anything anywhere on its own:

        - **Settings → Copy diagnostics** in the dashboard. Versions, whether Claude Code was found and
          logged in, and the last log lines with your home directory, your data directory and anything
          credential-shaped already replaced.
        - **`asterim stats`** in a terminal. Counts only, no names, paths, prompts or commands.

        Both are computed on your machine when you ask for them. Read them before you paste them; it is
        your call what to share.

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you asked the agent to do, and what the dashboard did instead.
      placeholder: |
        I asked it to rename a function. The status pill went to working and stayed there.
        No approval card ever appeared.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it stopped
      options:
        - Pairing the browser with the PIN
        - Adding a project
        - Starting the agent
        - Waiting for the agent to answer
        - An approval card that never appeared
        - An approval card that appeared but did nothing
        - The Changes view
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Copy diagnostics, pasted here.
      render: text
    validations:
      required: true

  - type: textarea
    id: stats
    attributes:
      label: Usage summary (optional)
      description: The output of `asterim stats`. Counts only. Skip it if you would rather not.
      render: text

  - type: input
    id: agent_version
    attributes:
      label: Which agent, and which version
      placeholder: "Claude Code 2.1.4"

  - type: checkboxes
    id: checked
    attributes:
      label: Before filing
      options:
        - label: I have read what I am pasting and removed anything I did not want to share.
          required: true
