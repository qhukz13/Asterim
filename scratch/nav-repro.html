<!doctype html><html><head><meta charset="utf-8"><style>:root {
  /* ==========================================
     Surfaces (Neutral Slate 4-Tier Elevation Stack)
     ========================================== */
  --color-surface-0: #0b0c0e; /* Deep Canvas (Underlay) */
  --color-surface-1: #121417; /* Primary Panel Surface (TopBar, Sidebar, Workspace) */
  --color-surface-2: #191c20; /* Elevated Interactive / Sub-panel Surface */
  --color-surface-3: #22262c; /* Active Selection / Floating Modal / Dropdown */

  --color-bg-base: var(--color-surface-0);
  --color-bg-elevated: var(--color-surface-1);
  --color-bg-overlay: rgba(11, 12, 14, 0.88);

  /* ==========================================
     Borders (Sub-Pixel Hairlines & Inset Highlights)
     ========================================== */
  --color-border-subtle: rgba(255, 255, 255, 0.06); /* 1px Vertical Hairline Splitters */
  --color-border-default: rgba(255, 255, 255, 0.12); /* Card & Control Boundaries */
  --color-border-strong: rgba(255, 255, 255, 0.20); /* Hover & Focus Boundaries */
  --color-border-hover: rgba(255, 255, 255, 0.28);
  --color-border-focus: var(--color-accent-primary);

  /* ==========================================
     Text & Typography Hierarchy (WCAG AAA Compliant)
     ========================================== */
  --color-text-primary: #f1f5f9;   /* High-Contrast Primary Body (#f1f5f9 vs #121417 = 13.8:1) */
  --color-text-secondary: #94a3b8; /* Secondary Labels & Structural Text (#94a3b8 vs #121417 = 6.2:1) */
  --color-text-muted: #64748b;     /* Timestamps & Secondary Metadata (#64748b vs #121417 = 3.8:1) */
  --color-text-contrast: #ffffff;

  /* ==========================================
     High-Precision Emerald Engineering Accent
     ========================================== */
  --color-accent-primary: #10b981;
  --color-accent-hover: #34d399;
  --color-accent-subtle: rgba(16, 185, 129, 0.12);
  --color-accent-glow: rgba(16, 185, 129, 0.25);

  /* ==========================================
     Agent Execution States
     ========================================== */
  --color-state-working: #10b981;
  --color-state-working-bg: rgba(16, 185, 129, 0.12);

  --color-state-paused: #f59e0b;
  --color-state-paused-bg: rgba(245, 158, 11, 0.12);

  --color-state-waiting: #a855f7;
  --color-state-waiting-bg: rgba(168, 85, 247, 0.12);

  --color-state-completed: #10b981;
  --color-state-completed-bg: rgba(16, 185, 129, 0.12);

  --color-state-error: #ef4444;
  --color-state-error-bg: rgba(239, 68, 68, 0.12);

  /* Legacy Semantic Mappings */
  --color-success-primary: var(--color-state-completed);
  --color-warning-primary: var(--color-state-paused);
  --color-error-primary: var(--color-state-error);

  /* ==========================================
     Typography Scale & Line Heights (PR8 Targets)
     ========================================== */
  --font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  /* Explicit PR8 Target Scale */
  --font-size-xs: 12px;   /* Timestamps, Caps, Secondary Badges */
  --font-size-sm: 13.5px; /* Monospace Code Logs, Sub-labels, Secondary Lists */
  --font-size-md: 15px;   /* Core Body Paragraphs, Chat Bubbles, Inputs */
  --font-size-lg: 16px;   /* Panel Titles, Tab Headers, Section Subheads */
  --font-size-xl: 20px;   /* Main Page / Thread Title */

  /* Measurable Line-Heights & Font Features */
  --line-height-tight: 1.25;  /* Headers & Compact Badges */
  --line-height-normal: 1.55; /* Extended Paragraph Body Text */
  --line-height-code: 1.50;   /* Monospace Code & Terminal Output */
  --line-height-relaxed: 1.65; /* Relaxed Ergonomic Reading */

  --font-variant-num: tabular-nums;
  --font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'tnum';

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ==========================================
     Spacing Scale (4px Base Grid)
     ========================================== */
  --spacing-1: 4px;
  --spacing-2: 8px;
  --spacing-3: 12px;
  --spacing-4: 16px;
  --spacing-5: 20px;
  --spacing-6: 24px;
  --spacing-8: 32px;

  /* ==========================================
     Control Heights (PR8 Standards)
     ========================================== */
  --control-height-sm: 32px;
  --control-height-md: 36px;
  --control-height-lg: 40px;  /* Primary Action Buttons (Send, New Project) */
  --control-height-input: 48px; /* Chat Input Area */

  /* ==========================================
     Border Radii
     ========================================== */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-full: 9999px;

  /* ==========================================
     Shadows & Elevations
     ========================================== */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.65);
  --shadow-focus: 0 0 0 2px var(--color-accent-glow);

  /* ==========================================
     Z-Index Layering
     ========================================== */
  --z-index-base: 1;
  --z-index-dropdown: 100;
  --z-index-sticky: 200;
  --z-index-overlay: 1000;
  --z-index-modal: 1050;
  --z-index-toast: 2000;

  /* ==========================================
     Motion & Transition Physics (PR10 Standards)
     ========================================== */
  --ease-out-cubic: cubic-bezier(0.16, 1, 0.3, 1);
  --transition-fast: 120ms cubic-bezier(0.16, 1, 0.3, 1);
  --transition-normal: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --active-scale: scale(0.98);

  /* ==========================================
     Layout Dimensions
     ========================================== */
  --nav-height: 48px;
  --sidebar-nav-width: 240px;
  --sidebar-session-width: 240px;
}
/* Workspace Shell Layout (Full Bleed Edge-to-Edge) */
.workspace-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
  background-color: var(--color-surface-0);
  color: var(--color-text-primary);
  font-family: var(--font-family-sans);
  overflow: hidden;
}

/* TopBar Layout */
.workspace-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--nav-height);
  padding: 0 var(--spacing-4);
  background: var(--color-surface-1);
  border-bottom: 1px solid var(--color-border-subtle);
  flex-shrink: 0;
  z-index: var(--z-index-sticky);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  width: var(--sidebar-nav-width);
}

.workspace-logo {
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-md);
  letter-spacing: 0.5px;
  color: var(--color-text-primary);
}

.topbar-center {
  flex: 1;
  display: flex;
  justify-content: center;
}

.global-search-placeholder {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border-subtle);
  padding: var(--spacing-1) var(--spacing-3);
  border-radius: var(--radius-md);
  width: 100%;
  max-width: 420px;
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
  cursor: pointer;
  transition: all 0.15s ease;
}

.global-search-placeholder:hover {
  background: var(--color-surface-3);
  border-color: var(--color-border-default);
  color: var(--color-text-secondary);
}

.search-shortcut {
  margin-left: auto;
  font-family: var(--font-family-mono);
  font-size: var(--font-size-xs);
  background: var(--color-surface-1);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
  color: var(--color-text-muted);
  border: 1px solid var(--color-border-subtle);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
}

.workstation-status-btn {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  background: transparent;
  border: none;
  color: var(--color-text-secondary);
  font-family: var(--font-family-sans);
  font-size: var(--font-size-sm);
  cursor: pointer;
  padding: var(--spacing-1) var(--spacing-2);
  border-radius: var(--radius-sm);
  transition: background 0.15s;
}

.workstation-status-btn:hover {
  background: var(--color-surface-2);
  color: var(--color-text-primary);
}

.avatar {
  width: 24px;
  height: 24px;
  border-radius: var(--radius-full);
  background: var(--color-accent-primary);
  color: var(--color-text-contrast);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
}

/* Workspace Body Layout (3 Columns) */
.workspace-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left Sidebar */
.workspace-navigation-sidebar {
  width: var(--sidebar-nav-width);
  background: var(--color-surface-1);
  border-right: 1px solid var(--color-border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

/* Center Session Sidebar */
.workspace-session-sidebar {
  width: var(--sidebar-session-width);
  background: var(--color-surface-1);
  border-right: 1px solid var(--color-border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

/* Main Content Area */
.workspace-main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--color-surface-0);
  position: relative;
  min-width: 0;
}

/* ==========================================
   View Navigation (Chat / Terminal / Changes / Memory / Settings / Environment)
   ==========================================
   The tab strip must stay reachable when the main content is squeezed — a narrow
   window, or the Inspector dragged out to its 500px maximum. Two things are needed
   and neither works alone:

   `min-width: 0` on the strip, because a flex item's default `min-width: auto`
   lets it grow to its content and simply extend past the parent. Measured before
   this rule: main content 540px wide ending at x=780, strip 668px wide, the
   Environment tab's right edge at x=932 — 152px underneath the Inspector, with
   scrollWidth === clientWidth, so there was no overflow to scroll.

   `overflow-x: auto` on top of that, which only becomes meaningful once the strip
   is actually constrained. */
.view-navigation {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}

.view-navigation-tabs {
  display: flex;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scroll-behavior: smooth;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--color-border-strong) transparent;
}

.view-navigation-tabs::-webkit-scrollbar {
  height: 6px;
}

.view-navigation-tabs::-webkit-scrollbar-track {
  background: transparent;
}

.view-navigation-tabs::-webkit-scrollbar-thumb {
  background: var(--color-border-strong);
  border-radius: var(--radius-full);
}

.view-navigation-tabs::-webkit-scrollbar-thumb:hover {
  background: var(--color-border-hover);
}

/* Tabs keep their full label rather than compressing into ambiguity. */
.view-navigation-tabs > .nav-btn {
  flex-shrink: 0;
}

/* Right-hand actions never collapse, and never take space from the tabs. */
.view-navigation-actions {
  flex-shrink: 0;
}

*{box-sizing:border-box} body{margin:0;font-family:var(--font-family-sans)}
button{font-family:inherit}
</style></head><body>
<div class="workspace-shell">
  <div class="workspace-body">
    <div class="workspace-navigation-sidebar" style="align-items:center;justify-content:center;color:var(--color-text-muted)">Nav</div>
    <div class="workspace-main-content">
      <div class="view-navigation" style="display:flex;justify-content:space-between;align-items:center;padding:8px 24px;border-bottom:1px solid var(--color-border-default)">
        <div style="display:flex;gap:8px"><button class="nav-btn" style="padding:8px 18px;height:40px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);background:var(--color-surface-2);color:#fff;display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--color-accent-primary);border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;border-left:none;border-right:none;border-top:none;white-space:nowrap">Chat</button><button class="nav-btn" style="padding:8px 18px;height:40px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);background:transparent;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;border-left:none;border-right:none;border-top:none;white-space:nowrap">Terminal</button><button class="nav-btn" style="padding:8px 18px;height:40px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);background:transparent;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;border-left:none;border-right:none;border-top:none;white-space:nowrap">Changes</button><button class="nav-btn" style="padding:8px 18px;height:40px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);background:transparent;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;border-left:none;border-right:none;border-top:none;white-space:nowrap">Memory</button><button class="nav-btn" style="padding:8px 18px;height:40px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);background:transparent;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;border-left:none;border-right:none;border-top:none;white-space:nowrap">Settings</button><button class="nav-btn" style="padding:8px 18px;height:40px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);background:transparent;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;border-left:none;border-right:none;border-top:none;white-space:nowrap">⚙ Environment</button></div>
        <div class="view-navigation-actions" style="display:flex;align-items:center;gap:12px"></div>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--color-text-muted)">Main workspace</div>
    </div>
    <aside class="workspace-inspector-panel" style="width:500px;border-left:1px solid var(--color-border-subtle);background:var(--color-surface-0);display:flex;flex-direction:column;overflow:hidden;position:relative">
      <div style="padding:12px;color:var(--color-text-secondary);font-size:13px">AI Context &amp; State</div>
    </aside>
  </div>
</div></body></html>
